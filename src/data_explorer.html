<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>能迹 · 数据探索</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f3;color:#19372e;font:16px/1.6 system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:48px 28px}header{border-bottom:1px solid #cbd6ce;padding-bottom:26px;margin-bottom:28px}small{letter-spacing:.12em;color:#527266}h1{font-size:clamp(30px,5vw,52px);margin:10px 0;font-weight:600}p{color:#53685f}label,button,select{font:inherit}button,select,input{max-width:100%}button{background:#205b48;color:white;border:0;padding:12px 22px;border-radius:8px;cursor:pointer}button:hover{background:#123f31}:focus-visible{outline:3px solid #bd770e;outline-offset:4px}.upload{background:white;border:1px dashed #809d8d;border-radius:12px;padding:24px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}.controls{display:flex;gap:20px;flex-wrap:wrap;margin:24px 0}select{padding:8px;background:white;border:1px solid #809d8d;border-radius:6px}#status{min-height:28px}#charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px}.card{background:white;border:1px solid #dce3dd;border-radius:12px;padding:24px;min-width:0}.card h2{font-size:19px;margin:0 0 12px}.bar{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;margin:12px 0;font-size:13px}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:12px;background:#edf1ee;border-radius:4px}.fill{height:100%;background:#34735b;border-radius:4px}.value{font-variant-numeric:tabular-nums;text-align:right}.table{overflow:auto;margin-top:24px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce3dd;white-space:nowrap}th{background:#e8eee9}footer{margin-top:32px;font-size:13px;color:#53685f}@media(max-width:500px){main{padding:24px 16px}.card{padding:16px}.bar{grid-template-columns:75px 1fr 70px}}@media print{.upload,.controls,button{display:none}main{padding:0}.card{break-inside:avoid}body{background:white}}
</style><main><header><small>能迹 / DATA EXPLORER</small><h1>让不同的数据，呈现清晰的故事。</h1><p>导入 JSON、XML 或 CSV，自动识别字段、生成图表并适配版面。</p></header><section class="upload"><label>选择数据文件 <input id="file" type="file" accept=".json,.xml,.csv"></label><button id="save" disabled>保存到 MySQL</button><label>文档编号 <input id="docid" type="number" min="1" style="width:100px"></label><button id="restore">从 MySQL 读取</button><button id="demo">体验示例</button><button onclick="window.print()">打印 / 保存 PDF</button></section><p id="status" role="status">支持 5 MB 以内文件。选择文件后可保存至 MySQL；按文档编号重新读取并生成图表。</p><div class="controls"><label>记录集合 <select id="collection"></select></label><label>分类字段 <select id="dimension"></select></label></div><section id="charts" aria-label="自动生成图表"></section><section class="table" id="preview"></section><footer>自动布局 · 数值字段独立展示，不混用单位。图表展示前 12 条记录，表格预览前 50 条；不自动求和或推断业务指标。</footer></main><script>
'use strict';
const $=id=>document.getElementById(id);let sets={},rows=[];
const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function flat(obj,prefix='',out={}){for(const [k,v] of Object.entries(obj)){const key=prefix?prefix+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))flat(v,key,out);else out[key]=Array.isArray(v)?JSON.stringify(v):v}return out}
function collections(value,path='root'){if(Array.isArray(value)){if(value.length&&value.every(x=>x&&typeof x==='object'&&!Array.isArray(x)))sets[path]=value.map(x=>flat(x));else if(value.every(x=>x===null||typeof x!=='object'))sets[path]=value.map(x=>({value:x}));value.forEach((x,i)=>{if(x&&typeof x==='object')collections(x,path+'['+i+']')})}else if(value&&typeof value==='object'){for(const [k,v]of Object.entries(value))if(v&&typeof v==='object')collections(v,path+'.'+k)}}
function xmlValue(e){if(!e.children.length)return e.textContent.trim();const out={};for(const a of e.attributes)out['@'+a.name]=a.value;for(const c of e.children){const v=xmlValue(c);if(Object.hasOwn(out,c.tagName)){if(!Array.isArray(out[c.tagName]))out[c.tagName]=[out[c.tagName]];out[c.tagName].push(v)}else out[c.tagName]=v}return out}
function csv(text){let data=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))data.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV 引号未闭合');row.push(cell);if(row.some(x=>x!==''))data.push(row);const headers=data.shift();if(!headers||new Set(headers).size!==headers.length)throw Error('CSV 表头为空或存在重复字段');return data.map(r=>{if(r.length!==headers.length)throw Error('CSV 列数不一致');return Object.fromEntries(headers.map((h,i)=>[h,r[i]]))})}
function load(value){sets={};collections(value);if(!Object.keys(sets).length&&value&&typeof value==='object')sets.root=[flat(value)];if(!Object.keys(sets).length)throw Error('未发现可展示的记录集合');$('collection').replaceChildren(...Object.keys(sets).map(k=>{const o=node('option',k);o.value=k;return o}));choose()}
function choose(){rows=sets[$('collection').value];const fields=[...new Set(rows.flatMap(Object.keys))];$('dimension').replaceChildren(...fields.map(k=>{const o=node('option',k);o.value=k;return o}));render()}
function numeric(v){return v!==null&&v!==undefined&&typeof v!=='boolean'&&String(v).trim()!==''&&Number.isFinite(Number(v))}
function render(){const fields=[...new Set(rows.flatMap(Object.keys))],dim=$('dimension').value,metrics=fields.filter(k=>k!==dim&&rows.some(r=>numeric(r[k]))&&rows.every(r=>r[k]==null||r[k]===''||numeric(r[k])));$('charts').replaceChildren();for(const m of metrics.slice(0,12)){const card=node('article',undefined,'card');card.append(node('h2',m));const sample=rows.slice(0,12),max=Math.max(...sample.map(r=>Math.abs(Number(r[m])||0)),1);for(const [i,r]of sample.entries()){const bar=node('div',undefined,'bar'),label=node('span',String(r[dim]??i+1)),track=node('div',undefined,'track'),fill=node('div',undefined,'fill');label.title=label.textContent;fill.style.width=(Math.abs(Number(r[m])||0)/max*100)+'%';track.append(fill);bar.append(label,track,node('span',numeric(r[m])?Number(r[m]).toLocaleString():'—','value'));card.append(bar)}card.append(node('small','条长表示数值绝对值；正负见数值标签'));$('charts').append(card)}if(!metrics.length)$('charts').append(node('p','未识别到数值字段，请选择其他分类字段或记录集合。'));const table=node('table'),head=node('tr');fields.forEach(k=>head.append(node('th',k)));table.append(head);rows.slice(0,50).forEach(r=>{const tr=node('tr');fields.forEach(k=>tr.append(node('td',String(r[k]??'—'))));table.append(tr)});$('preview').replaceChildren(table);$('status').textContent=`已导入 ${rows.length} 条记录 · ${fields.length} 个字段 · ${metrics.length} 个数值字段（最多展示 12 张图）`}
$('collection').onchange=choose;$('dimension').onchange=render;
$('demo').onclick=()=>load([{车间:'冲压',电量:1260,费用:882},{车间:'装配',电量:980,费用:686},{车间:'热处理',电量:1820,费用:1274}]);
let selectedFile=null;
$('save').onclick=async()=>{if(!selectedFile)return;const button=$('save');button.disabled=true;try{const response=await fetch('/api/v1/documents?filename='+encodeURIComponent(selectedFile.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:selectedFile});const data=await response.json();if(!response.ok)throw Error(data.detail);$('docid').value=data.id;$('status').textContent='已保存到 MySQL，文档编号：'+data.id}catch(err){$('status').textContent='保存失败：'+err.message}finally{button.disabled=false}};
$('restore').onclick=async()=>{try{const response=await fetch('/api/v1/documents/'+encodeURIComponent($('docid').value));const data=await response.json();if(!response.ok)throw Error(data.detail);const file=new File([data.raw_content],data.filename);await $('file').onchange({target:{files:[file]}})}catch(err){$('status').textContent='读取失败：'+err.message}};
$('file').onchange=async e=>{try{selectedFile=null;$('save').disabled=true;const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)throw Error('文件超过 5 MB');const text=(await f.text()).replace(/^\uFEFF/,'');if(/\.json$/i.test(f.name))load(JSON.parse(text));else if(/\.xml$/i.test(f.name)){if(/<!DOCTYPE|<!ENTITY/i.test(text))throw Error('不支持带 DTD 或实体声明的 XML');const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw Error('XML 格式无效');load(xmlValue(doc.documentElement))}else if(/\.csv$/i.test(f.name))load(csv(text));else throw Error('请选择 JSON、XML 或 CSV');selectedFile=f;$('save').disabled=false}catch(err){$('status').textContent='导入失败：'+err.message;$('charts').replaceChildren();$('preview').replaceChildren();$('collection').replaceChildren();$('dimension').replaceChildren()}};
</script></html>
