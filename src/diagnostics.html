<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能诊断工作台 · 工业能源分析</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#19312e;background:#f2f5f3}*{box-sizing:border-box}body{margin:0}header{background:#173e35;color:white;padding:28px 5vw}header small{color:#b9d7ce}h1{font-size:28px;margin:8px 0}main{max-width:1440px;margin:auto;padding:24px}button,select,input,textarea{font:inherit;border:1px solid #cbd7d0;border-radius:7px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#246652;color:white;border-color:#246652}button:disabled{opacity:.5;cursor:wait}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}label{display:grid;gap:6px;font-size:13px}.layout{display:grid;grid-template-columns:minmax(340px,1fr) minmax(400px,1.2fr);gap:20px}.card{background:white;border:1px solid #dfe7e1;border-radius:12px;padding:20px;min-width:0}h2{font-size:19px;margin:0 0 16px}h3{font-size:15px;margin-top:24px}p{line-height:1.7}small,.muted{color:#63796e;font-size:13px}.incident{width:100%;text-align:left;margin-bottom:10px;display:grid;gap:7px;padding:15px}.incident.active{border-color:#246652;background:#eef7f1}.badge{font-size:12px;color:#8e531b}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact{background:#f3f6f3;padding:12px;border-radius:8px}.fact b{display:block;margin-top:8px;font-size:20px}table{border-collapse:collapse;font-size:12px;width:100%}td,th{padding:8px;border-bottom:1px solid #e5ece6;text-align:left;white-space:nowrap}.scroll{overflow:auto;max-height:260px}.form{display:grid;gap:12px}textarea{width:100%;resize:vertical}.notice{background:#f7f2e8;padding:12px;border-radius:8px;font-size:13px}#message{min-height:24px;color:#a23924;margin-bottom:10px}.answer{padding:12px;background:#f2f7f4;margin-top:12px;overflow-wrap:anywhere}details{margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:inherit}.history{border-left:3px solid #c7ded0;padding-left:12px;margin:12px 0}footer{margin-top:16px;font-size:12px;color:#63796e}@media(max-width:850px){.layout{grid-template-columns:1fr}main{padding:14px}.facts{grid-template-columns:1fr}}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat{display:grid;gap:8px;text-align:left;background:white;border:1px solid #dfe7e1;padding:16px;border-radius:10px}.stat strong{font-size:26px}.priority-stat{background:#f7f2e8}.check{display:flex;align-items:center;gap:8px}.quick{display:flex;flex-wrap:wrap;gap:8px}.quick button{font-size:12px}.trend{background:#f5f8f5;border-radius:8px;padding:12px}.trend svg{width:100%;display:block}.layout{align-items:start}#message{overflow-wrap:anywhere}@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><small>工业能源分析 / 异常处置</small><h1>智能诊断工作台</h1><div>从异常证据到处理反馈，让每一次判断都有据可查。</div></header>
<main><form id="filters" class="filters"><label>车间<select id="workshop"><option value="">全部车间</option></select></label><label>起始日期<input type="date" id="from"></label><label>结束日期<input type="date" id="to"></label><label>处理状态<select id="status"><option value="">全部状态</option><option value="pending">待核查</option><option value="confirmed">已确认异常</option><option value="false_positive">误报</option><option value="resolved">已处理</option></select></label><label>排序<select id="sort"><option value="recent">日期最新</option><option value="priority">未处理优先</option></select></label><label class="check"><input type="checkbox" id="priority">仅优先核查</label><button class="primary">筛选</button><button type="button" id="clear">重置</button><button type="button" id="refresh">刷新数据</button></form>
<div id="message" role="alert"></div><div id="summary" class="summary" aria-label="处理状态统计"></div><p class="muted">统计随车间、日期和优先级条件变化，点击状态可筛选。</p><div class="layout"><section class="card"><div class="row"><h2>异常列表</h2><small id="count"></small></div><p class="muted" id="updated"></p><div id="list"></div><div class="row"><button id="prev">上一页</button><small id="page"></small><button id="next">下一页</button></div><footer>日度单耗与月度环比独立展示。月度告警按月首日筛选。可按日期或未处理优先排序；优先级是核查规则，不能解释为故障概率。</footer></section>
<section class="card" id="detail"><p class="muted">选择一条异常，查看证据、提出问题并记录处理结果。</p></section></div></main>
<script src="/diagnostics.js" defer></script></body></html>
