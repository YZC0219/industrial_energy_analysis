name: Build GitHub Pages report

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-pages-report.yml"
      - "src/make_report.py"
      - "src/report_template.html"
      - "tests/baseline/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate report from verified baselines
        run: |
          mkdir -p output docs
          cp tests/baseline/*.csv output/
          python src/make_report.py
          cp output/report.html docs/index.html
          rm -f docs/docs/index.html
          rmdir docs/docs 2>/dev/null || true

      - name: Commit generated Pages report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git add -u docs
          if git diff --cached --quiet; then
            echo "Report is already current."
          else
            git commit -m "Deploy visualization report to GitHub Pages"
            git push
          fi
