name: Build GitHub Pages report

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-pages-report.yml"
      - "README.md"
      # 报告的直接输入
      - "src/make_report.py"
      - "src/report_template.html"
      - "src/mobile.css"
      - "tests/baseline/**"
      # 管道上游: 改了这些会让基线失效, 必须触发校验(否则守卫被跳过,
      # 报告照旧发布 —— 那正是这个 workflow 要防的静默漂移)
      - "src/generate_data.py"
      - "src/clean_data.py"
      - "src/import_mysql.py"
      - "src/api.py"
      - "sql/**"
      - "datax/**"
      - "hive/**"
      - "spark/**"
      - "ml/**"
      - "tests/test_ml_pipeline.py"
      - "tests/test_import_mysql.py"
      - "tests/test_import_mysql_helpers.py"
      - "tests/test_api.py"
      - "tests/test_bi_contract.py"
      - "tests/test_stage1_architecture.py"
      - "tests/test_soft_delete_contract.py"
      - "tools/verify_ml_artifacts.py"
      - "tools/run_phase2.py"
      - "tools/check_data_quality.py"
      - "tools/check_hive_quality.py"
      - "tools/ensure_*_soft_delete_schema.py"
      - "tools/setup_bi_reader.py"
      - "docs/阶段四_服务化与可视化交付.md"
      - "docs/阶段三_数据质量与实时管道.md"
      - "quality/**"
      - "tests/test_data_quality.py"
      - "ml/provenance.py"
      - "dags/energy_pipeline_dag.py"
      - "docker-compose.yml"
      - ".env.example"
      - "streaming/**"
      - "tests/test_streaming_contract.py"
      - "tests/test_stream_batch_reconciliation.py"
      - "tools/run_streaming_experiment.py"
      - "tools/reconcile_stream_batch.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: energy_root_pwd
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -penergy_root_pwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      # ---- 守卫: 基线必须先被证明是"当前正确的答案" ----
      #
      # 报告是用 tests/baseline/*.csv 当**数据源**生成的(不连库, 这样 CI 快且
      # 可复现)。但这带来一个静默风险: 如果改了清洗/口径却**忘了**刷新基线,
      # 报告会照着旧基线生成 —— 数字自洽、CI 全绿, 只是结论已经过期。
      #
      # 所以这里先从**真实数据库**跑一遍完整管道和 29 条查询, 与基线逐行逐列比对
      # (tests/test_analysis_snapshot.py)。不一致就让 CI 红掉, 而不是发布一份
      # 悄悄变旧的报告。
      #
      # **顺序很关键**: 必须在 `cp tests/baseline/*.csv output/` **之前**跑。
      # 那个测试比对的是 output/ 里的 CSV, 而拷贝会让 output == baseline,
      # 比对恒等通过 —— 守卫就成了摆设。
      - name: Rebuild warehouse from source (for baseline verification)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3307"
          MYSQL_USER: root
          MYSQL_PWD: energy_root_pwd
        run: |
          python src/generate_data.py
          python src/clean_data.py
          python src/clean_data.py --batch-all
          python src/import_mysql.py --init --full --run-analysis
        # 这里的两条命令都必须讲究, 且是**两种不同的错法** ——
        #
        # 1. 清洗要用**全量模式**(不带 --batch-all)。装载读的是全量产物
        #    clean_energy.csv / clean_production.csv; 而 --batch-all 只写
        #    clean_batch_*.csv(批模式不写 clean_rejects/fixed.csv, 也不写
        #    clean_report.txt 供人读), 于是装载直接找不到文件退出。
        #
        # 2. 装载要写成**一条** `--init --full --run-analysis`, 与
        #    import_mysql.py 手册里的"首次部署"用法一致。拆成
        #    `--init --full` + `--run-analysis` 是错的: 第一条会把水位线重置为
        #    全量最大值, 第二条再跑时水位线**非空** -> 判定为增量装载 ->
        #    又去找 clean_batch_energy.csv(全量清洗没写它) -> 失败。
        #    它不是"少了个 flag", 而是这段流程本来就是一次调用。
        #
        # 这两种错都发生在 `Verify baselines ...` **之前**, 那一步会被整步跳过 ——
        # 守卫一次都没跑过, 而 `pages build and deployment` 照常绿, 页面照常发布。
        # 本地也看不出来: 工作区里留着上一次全量清洗的 output/ 产物, 恰好把缺口
        # 盖住了; CI 从空 output/ 开始, 藏不住。

      - name: Verify baselines against freshly computed results
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3307"
          MYSQL_USER: root
          MYSQL_PWD: energy_root_pwd
        run: |
          python -m pytest tests/test_analysis_snapshot.py -m db -q
        # 失败即中止 —— 后面的步骤不会用未经验证的基线去生成报告。
        # 若改动是有意改变口径, 本地跑 python tests/update_baseline.py 刷新基线,
        # 在提交信息里写明为什么变, 再 push。

      - name: Verify MySQL incremental load and tombstone behavior
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3307"
          MYSQL_USER: root
          MYSQL_PWD: energy_root_pwd
        run: python -m pytest tests/test_import_mysql.py -m db -q

      - name: Build and verify forecasting artifacts
        run: |
          python tools/run_phase2.py --energy output/clean_batch_energy.csv --production output/clean_batch_production.csv
          python tools/check_data_quality.py --energy output/clean_batch_energy.csv --production output/clean_batch_production.csv
          python -m ml.evaluate_attribution --sql-dir tests/baseline
          python -m pytest -q

      - name: Upload forecasting evidence
        uses: actions/upload-artifact@v4
        with:
          name: forecasting-evidence-${{ github.sha }}
          path: |
            output/ml_features.csv
            output/ml_model_predictions.csv
            output/ml_model_metrics.json
            output/ml_provenance.json
            output/attribution_eval.json
            output/data_quality_report.json
          if-no-files-found: error
          retention-days: 30

      # ---- 生成 Pages 报告 ----
      - name: Generate responsive report from verified baselines
        run: |
          mkdir -p /tmp/report-evidence
          cp output/ml_model_metrics.json output/attribution_eval.json /tmp/report-evidence/
          if [ -f output/ml_deep_metrics.json ]; then cp output/ml_deep_metrics.json /tmp/report-evidence/; fi
          if [ -f output/engine_comparison.json ]; then cp output/engine_comparison.json /tmp/report-evidence/; fi
          if [ -f output/lakehouse_validation.json ]; then cp output/lakehouse_validation.json /tmp/report-evidence/; fi
          cp output/pandas_daily.csv /tmp/report-evidence/
          cp output/clean_energy.csv output/clean_production.csv output/dim_calendar.csv /tmp/report-evidence/
          cp output/clean_rejects.csv output/clean_fixed.csv /tmp/report-evidence/
          rm -rf output
          mkdir -p output docs
          cp tests/baseline/*.csv output/
          cp /tmp/report-evidence/*.json output/
          cp /tmp/report-evidence/pandas_daily.csv output/
          cp /tmp/report-evidence/clean_*.csv /tmp/report-evidence/dim_calendar.csv output/
          python - <<'PY'
          from src.make_report import _recent_evidence
          if not _recent_evidence()["available"]:
              raise SystemExit("Pages report evidence does not reconcile with the Q01 snapshot")
          PY
          python src/make_report.py
          python - <<'PY'
          from pathlib import Path
          report = Path("output/report.html")
          css = Path("src/mobile.css").read_text(encoding="utf-8")
          html = report.read_text(encoding="utf-8")
          if "</head>" not in html:
              raise SystemExit("Generated report has no </head> tag")
          report.write_text(
              html.replace("</head>", f"<style>\n{css}\n</style>\n</head>", 1),
              encoding="utf-8",
          )
          PY
          cp output/report.html docs/index.html
          rm -f docs/docs/index.html
          rmdir docs/docs 2>/dev/null || true

      - name: Commit generated Pages report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git add -u docs
          if git diff --cached --quiet; then
            echo "Report is already current."
          else
            git commit -m "Deploy visualization report to GitHub Pages"
            # push 前先 rebase: 本 workflow 从 checkout 到 push 要跑一分多钟,
            # 期间 main 可能已经往前走(实测撞到过)。直接 push 会因 non-fast-forward
            # 被拒, 整步红掉 —— 而报告本身是对的, 失败与内容无关。
            # 本提交只改 docs/index.html, 与代码提交不同文件, rebase 不会冲突。
            git pull --rebase origin main
            git push
          fi
