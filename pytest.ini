[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 打印中文断言信息时不要被截断
#
# -m "not db": 默认只跑离线测试, 这样"克隆仓库就能跑 pytest 且全绿"成立,
# 不要求先起一个 MySQL。要跑数据库测试需显式指定: python -m pytest -m db
addopts = -ra --strict-markers -m "not db"

markers =
    db: 需要 MySQL 的测试(装载一致性、Q01~Q23 结果回归)。默认跳过
    slow: 需要重跑整条管道的测试(数十秒)
