# 工业能耗数据管道 —— 本地一键起
#
#   docker compose up -d
#   打开 http://localhost:8080  (admin / admin)
#   在 DAG 列表里把 energy_pipeline 打开(取消 Pause), 点 Trigger
#
# 五个服务:
#   postgres          Airflow 自己的元数据库(存 DAG 状态、任务实例、变量)
#   mysql             项目的分析仓库(星型模型 + 24 条查询跑在这里)
#   airflow-init      一次性任务: 建元数据库表 + 建管理员账号, 跑完即退出
#   airflow-scheduler 调度器, 按 DAG 定义派发任务
#   airflow-webserver Web UI
#
# 为什么元数据库用 Postgres 而不是复用 MySQL?
# 两个库的职责完全不同 —— 一个是调度器的内部状态, 一个是业务数据。混在一起的话
# 重建业务库会连带把调度历史清掉, 而且两者的备份/恢复策略也不一样。

---
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: industrial-energy-airflow:2.10.5
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # 默认值是 .env.example 里那个公开的演示密钥, 让 `docker compose up -d` 零配置可跑;
    # 真实部署必须换成自己生成的, 见 .env.example 里的说明。
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-CW4eOk3E3NBmT-kQ9xZl1akrr2z_opE-5ayR9zZMpQY=}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # 项目自己的连接参数 —— 全部走环境变量, 口令不落盘、不进代码
    MYSQL_HOST: mysql
    MYSQL_PORT: '3306'
    MYSQL_USER: root
    MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-energy_root_pwd}
    MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-energy_root_pwd}
    MYSQL_DB: industrial_energy
    MYSQL_JDBC_URL: ${MYSQL_JDBC_URL:-jdbc:mysql://mysql:3306/industrial_energy}
    LAKEHOUSE_ENABLED: ${LAKEHOUSE_ENABLED:-0}
    HDFS_DEFAULT_FS: ${HDFS_DEFAULT_FS:-hdfs://namenode:8020}
    HIVE_STAGE_PATH: ${HIVE_STAGE_PATH:-/warehouse/energy_ods}
    DATAX_ENTRY: ${DATAX_ENTRY:-/opt/datax/bin/datax.py}
    SPARK_SQL: ${SPARK_SQL:-spark-sql}
    ENERGY_ALERT_WEBHOOK: ${ENERGY_ALERT_WEBHOOK:-}
    PROJECT_DIR: /opt/airflow/project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/airflow/project
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    mysql:
      condition: service_healthy

services:

  # ---- Airflow 元数据库 ------------------------------------------------
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---- 项目分析仓库 ----------------------------------------------------
  mysql:
    image: mysql:8.0
    # local_infile 必须开在**服务端**: 装载脚本用 LOAD DATA LOCAL INFILE,
    # 客户端那边 import_mysql.py 已经带了 local_infile=True, 服务端不开就会
    # 报 "The used command is not allowed with this MySQL version"。
    command:
      - --local-infile=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-energy_root_pwd}
      MYSQL_DATABASE: industrial_energy
    volumes:
      - mysql-data:/var/lib/mysql
      # 装载脚本用 LOAD DATA LOCAL INFILE 把 output/*.csv 灌进事实表。
      # 该语句的文件是**服务端**按自己的文件系统打开的, 所以 output 目录
      # 必须也挂进 mysql 容器, 且路径要和 airflow 容器里的一致 —— 否则
      # 服务端会报 File not found。只读挂载即可。
      - ./output:/opt/airflow/project/output:ro
    # 映射到宿主机的 3307 而不是 3306: 一是避开本机可能已装的 MySQL,
    # 二是方便用客户端连进去看数据。不需要就直接注释掉。
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ---- 一次性初始化: 建元数据库表 + 管理员账号 --------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        # 账号已存在时 create 会报错, 用 || 兜住, 这样 `docker compose up` 可重复执行
        airflow users create \
          --username admin \
          --password admin \
          --firstname Air \
          --lastname Flow \
          --role Admin \
          --email admin@example.com \
          || echo "账号 admin 已存在, 跳过创建"
        echo "初始化完成: 账号 admin / admin"
    restart: on-failure

  # ---- 调度器 ----------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # 注意: YAML 的合并键是"整键替换"而非深合并, 所以 depends_on 必须写全,
    # 否则会把 common 里的 postgres/mysql 依赖覆盖掉。
    # 三者缺一不可: 元数据库要就绪、业务库要就绪、建表迁移要跑完。
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- Web UI ----------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- 可选实时实验栈: docker compose --profile streaming up ----------------
  kafka:
    image: apache/kafka:3.9.1
    profiles: [streaming]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 120000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka-streaming-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  kafka-topics-init:
    image: apache/kafka:3.9.1
    profiles: [streaming]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic energy-events --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic energy-alerts --partitions 1 --replication-factor 1
    restart: "no"

  flink-connector-init:
    image: curlimages/curl:8.12.1
    profiles: [streaming]
    user: "0:0"
    command:
      - -fsSL
      - -o
      - /shared/flink-sql-connector-kafka-3.3.0-1.20.jar
      - https://repo.maven.apache.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.3.0-1.20/flink-sql-connector-kafka-3.3.0-1.20.jar
    volumes:
      - flink-kafka-connector:/shared
    restart: "no"

  flink-checkpoint-init:
    image: flink:1.20.2-scala_2.12-java17
    profiles: [streaming]
    user: "0:0"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - chown -R 9999:9999 /opt/flink/checkpoints
    volumes:
      - flink-streaming-checkpoints:/opt/flink/checkpoints
    restart: "no"

  flink-jobmanager:
    image: flink:1.20.2-scala_2.12-java17
    profiles: [streaming]
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - cp /connectors/*.jar /opt/flink/lib/ && exec /docker-entrypoint.sh jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        execution.checkpointing.interval: 2s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend.type: hashmap
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 60
        restart-strategy.fixed-delay.delay: 2s
    ports:
      - "8081:8081"
    volumes:
      - ./streaming/flink:/opt/flink/sql:ro
      - flink-kafka-connector:/connectors:ro
      - flink-streaming-checkpoints:/opt/flink/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      flink-connector-init:
        condition: service_completed_successfully
      flink-checkpoint-init:
        condition: service_completed_successfully
    restart: unless-stopped

  flink-taskmanager:
    image: flink:1.20.2-scala_2.12-java17
    profiles: [streaming]
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - cp /connectors/*.jar /opt/flink/lib/ && exec /docker-entrypoint.sh taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        execution.checkpointing.interval: 2s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend.type: hashmap
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 60
        restart-strategy.fixed-delay.delay: 2s
    volumes:
      - ./streaming/flink:/opt/flink/sql:ro
      - flink-kafka-connector:/connectors:ro
      - flink-streaming-checkpoints:/opt/flink/checkpoints
    depends_on:
      flink-jobmanager:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-db:
  mysql-data:
  airflow-logs:
  kafka-streaming-data:
  flink-kafka-connector:
  flink-streaming-checkpoints:
