version: 2
source_of_truth: sql/analysis.sql; pinned SQL blocks and typed table contracts; no
  averaging or summing derived analytical results
metrics:
- id: total_energy_tce
  name: 综合能耗
  unit: tce
  source_query: Q28
  column: 综合能耗_tce
  aggregation: sum
  definition: 各能源折标煤后汇总；不直接相加不同能源实物量
- id: net_energy_tce
  name: 剔除公用工程净用能
  unit: tce
  source_query: Q28
  column: 综合能耗_tce
  aggregation: sum
  exclude_process: 公用工程
  definition: 排除工序为公用工程的车间日综合能耗
- id: energy_intensity_kgce
  name: 单位产品单耗
  unit: kgce/产量单位
  source_query: Q28
  column: 综合能耗_tce
  denominator: 产量
  scale: 1000
  aggregation: ratio_of_sums
  exclude_process: 公用工程
  definition: 单车间综合能耗之和×1000/对应产量之和；不跨车间相加不同产品产量
  scope: single_workshop_only
- id: analysis_Q01
  name: 能源消费总览
  source_query: Q01
  aggregation: sql_result
  result_kind: table
  definition: 全厂 2024-2025 综合能耗、费用、碳排放总量与日均水平
  unit: per_column
- id: analysis_Q02
  name: 剔除公用工程后的能耗总览
  source_query: Q02
  aggregation: sql_result
  result_kind: table
  definition: 动力站(公用工程)产出的蒸汽被其他车间二次消费, 全厂口径会重复计算,
  unit: per_column
- id: analysis_Q03
  name: 各车间综合能耗排名
  source_query: Q03
  aggregation: sql_result
  result_kind: table
  definition: 折标煤口径的车间能耗排名, 含占比与费用强度
  unit: per_column
- id: analysis_Q04
  name: 能源结构_折标煤与费用双口径
  source_query: Q04
  aggregation: sql_result
  result_kind: table
  definition: 各能源品种的实物量、折标煤占比、费用占比、碳排放
  unit: per_column
- id: analysis_Q05
  name: 月度能耗趋势与环比
  source_query: Q05
  aggregation: sql_result
  result_kind: table
  definition: 逐月综合能耗、费用, 并用窗口函数计算环比(MoM)
  unit: per_column
- id: analysis_Q06
  name: 各车间能耗同比
  source_query: Q06
  aggregation: sql_result
  result_kind: table
  definition: 2025 年 vs 2024 年综合能耗同比, 产量增长的同时能耗是否同步增长
  unit: per_column
- id: analysis_Q07
  name: 各车间单位产品能耗月度趋势
  source_query: Q07
  aggregation: sql_result
  result_kind: table
  definition: 单位产品综合能耗(kgce/单位产量), 口径为剔除公用工程后的生产车间
  unit: per_column
- id: analysis_Q08
  name: 单位产品能耗同比_节能改造效果
  source_query: Q08
  aggregation: sql_result
  result_kind: table
  definition: 以年度平均单耗衡量各车间节能改造的实际成效
  unit: per_column
- id: analysis_Q09
  name: 能源费用帕累托分析
  source_query: Q09
  aggregation: sql_result
  result_kind: table
  definition: 车间能源费用降序累计占比, 识别关键少数(通常前 3 个车间占 70%+)
  unit: per_column
- id: analysis_Q10
  name: 各车间能耗结构
  source_query: Q10
  aggregation: sql_result
  result_kind: table
  definition: '交叉表: 每个车间各能源品种的折标煤消耗, 定位各车间的用能特征'
  unit: per_column
- id: analysis_Q11
  name: 气温与能耗的关系_分档
  source_query: Q11
  aggregation: sql_result
  result_kind: table
  definition: 仅取连续型车间(全年不停产), 排除停产日对气温信号的干扰。
  unit: per_column
- id: analysis_Q12
  name: 气温与各能源相关系数
  source_query: Q12
  aggregation: sql_result
  result_kind: table
  definition: 手算 Pearson 相关系数(MySQL 无 CORR 函数), 同样限定连续型车间。
  unit: per_column
- id: analysis_Q13
  name: 停产日待机损耗分析
  source_query: Q13
  aggregation: sql_result
  result_kind: table
  definition: 非生产日仍发生的能耗即待机损耗, 是节能挖潜的重点
  unit: per_column
- id: analysis_Q14
  name: 工作日与周末节假日能耗对比
  source_query: Q14
  aggregation: sql_result
  result_kind: table
  definition: 对比不同日型的日均能耗与日均费用
  unit: per_column
- id: analysis_Q15
  name: 各节假日能耗水平
  source_query: Q15
  aggregation: sql_result
  result_kind: table
  definition: 按 年份+节日 统计停工期能耗, 识别长假期间的能源浪费
  unit: per_column
- id: analysis_Q16
  name: 单耗异常日检测_2sigma
  source_query: Q16
  aggregation: sql_result
  result_kind: table
  definition: 单位产品能耗超过车间自身 均值+2倍标准差 的日期, 用于能效诊断
  unit: per_column
- id: analysis_Q17
  name: 能耗连续三日上涨
  source_query: Q17
  aggregation: sql_result
  result_kind: table
  definition: 窗口函数识别连续 3 天能耗递增的车间, 及时发现跑冒滴漏与设备劣化
  unit: per_column
- id: analysis_Q18
  name: 全厂能耗7日移动平均
  source_query: Q18
  aggregation: sql_result
  result_kind: table
  definition: 平滑日波动, 观察能耗趋势与波动区间
  unit: per_column
- id: analysis_Q19
  name: 能源采购单价月度波动
  source_query: Q19
  aggregation: sql_result
  result_kind: table
  definition: 实际结算均价 vs 主数据参考价, 监控采购价偏离与成本风险
  unit: per_column
- id: analysis_Q20
  name: 电耗强度月度趋势
  source_query: Q20
  aggregation: sql_result
  result_kind: table
  definition: 单位产量电耗(kWh/单位), 电力是最主要的二次能源成本项
  unit: per_column
- id: analysis_Q21
  name: 碳排放强度
  source_query: Q21
  aggregation: sql_result
  result_kind: table
  definition: 月度碳排放总量与单位标煤碳排强度, 反映能源结构清洁化程度
  unit: per_column
- id: analysis_Q22
  name: 能耗突增预警_环比超25pct
  source_query: Q22
  aggregation: sql_result
  result_kind: table
  definition: 月度环比增幅超 25% 的车间, 作为能效异常的第一道告警
  unit: per_column
- id: analysis_Q23
  name: 能耗最高的车间日TOP20
  source_query: Q23
  aggregation: sql_result
  result_kind: table
  definition: 绝对能耗最高的车间-日, 用于峰值负荷与容量费管理
  unit: per_column
- id: analysis_Q25
  name: 产量基线单耗期望值
  source_query: Q25
  aggregation: sql_result
  result_kind: table
  definition: 【#10 考虑产量的能耗基线】按 产量 + 季节 拟合该车间的"期望单耗", 再拿
  unit: per_column
- id: analysis_Q26
  name: 三种检测方法对比
  source_query: Q26
  aggregation: sql_result
  result_kind: table
  definition: 【#12 算法对比实验】固定 2σ 阈值法 / 产量基线残差法 / CUSUM 累积和法
  unit: per_column
- id: analysis_Q27
  name: 单耗CUSUM累积和序列
  source_query: Q27
  aggregation: sql_result
  result_kind: table
  definition: 【#11 CUSUM 累积和控制图】每个车间的 S⁺/S⁻ 逐日轨迹, 供报告画累积和控制图。
  unit: per_column
- id: analysis_Q28
  name: 各车间日度能耗与产量
  source_query: Q28
  aggregation: sql_result
  result_kind: table
  definition: 【#14 动态筛选的数据底座】把 车间 × 日 一行的"能耗 × 费用 × 碳排 × 产量 ×
  unit: per_column
- id: analysis_Q29
  name: 各车间日度能耗结构
  source_query: Q29
  aggregation: sql_result
  result_kind: table
  definition: 【#14 动态筛选的数据底座, 结构用】日 × 车间 × 能源 的"实物量 × 折标煤 ×
  unit: per_column
- id: analysis_Q24
  name: 单耗每日序列与2sigma带
  source_query: Q24
  aggregation: sql_result
  result_kind: table
  definition: 每个车间的每日单位产品能耗, 附该车间自身的均值与标准差, 供报告画
  unit: per_column
- id: total_cost_yuan
  name: 能源总费用
  source_query: Q28
  column: 能源费用_元
  unit: CNY
  aggregation: sum
  definition: 能源总费用按车间日记录求和
- id: net_cost_yuan
  name: 剔除公用工程费用
  source_query: Q28
  column: 能源费用_元
  unit: CNY
  aggregation: sum
  definition: 剔除公用工程费用按车间日记录求和
  exclude_process: 公用工程
- id: total_carbon_tco2
  name: 碳排放总量
  source_query: Q28
  column: 碳排放_tCO2
  unit: tCO2
  aggregation: sum
  definition: 碳排放总量按车间日记录求和
- id: net_carbon_tco2
  name: 剔除公用工程碳排放
  source_query: Q28
  column: 碳排放_tCO2
  unit: tCO2
  aggregation: sum
  definition: 剔除公用工程碳排放按车间日记录求和
  exclude_process: 公用工程
